<div class="bar">
  <a href="#top" class="brand" aria-label="La Luma Hotel and Restaurants, back to top">
    <img src="images/logo-mark.png" class="brand-mark" alt="" />
    <span class="brand-text">
      <img src="images/logo-wordmark.png" class="brand-wordmark" alt="" />
      <span class="brand-tag">HOTEL AND RESTAURANTS</span>
    </span>
  </a>
  <nav class="nav" aria-label="Main">
    @for (link of links; track link.href) {
      <a [href]="link.href" class="nav-link">{{ link.label.toUpperCase() }}</a>
    }
    <a [href]="phone.href" class="nav-cta">RESERVE</a>
  </nav>
  <button
    type="button"
    class="menu-btn"
    aria-controls="mobile-menu"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    {{ menuOpen() ? 'CLOSE' : 'MENU' }}
  </button>
</div>
@if (menuOpen()) {
  <div class="mobile-menu" id="mobile-menu">
    @for (link of links; track link.href) {
      <a [href]="link.href" class="mobile-link" (click)="closeMenu()">{{ link.label }}</a>
    }
    <a [href]="phone.href" class="mobile-cta">CALL {{ phone.label }}</a>
  </div>
}
