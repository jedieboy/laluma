# Netlify: build the Angular app and serve the browser bundle.
[build]
  command = "npm run build"
  publish = "dist/la-luma/browser"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: send unknown paths to index.html instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
